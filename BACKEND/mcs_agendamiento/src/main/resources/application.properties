# Puerto
server.port=${PORT:8081}

# ------------------------
# MySQL
# ------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:agendadb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.datasource.hikari.initializationFailTimeout=0

# Incluir mensaje de error en respuestas 5xx/4xx mientras pruebas
server.error.include-message=always
server.error.include-binding-errors=always

# ------------------------
# URLs de otros microservicios (se pueden sobreescribir por ENV)
# Dentro de docker-compose: usar nombres de servicio (mcs_medicos / mcs_pacientes)
# Fuera (dev local), puedes exportar MEDICOS_URL/PACIENTES_URL a http://localhost:8082 / 8083
# ------------------------
clients.medicos-url=${MEDICOS_URL:http://mcs-medicos:8082}
clients.pacientes-url=${PACIENTES_URL:http://mcs-pacientes:8083}

# ------------------------
# RabbitMQ
# ------------------------
spring.rabbitmq.host=${RABBIT_HOST:rabbit}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASS:guest}

# Exchange y routing key (el exchange se declara vía RabbitConfig)
app.rabbit.exchange=${RABBIT_EXCHANGE:citas.exchange}
app.rabbit.routing.citaConfirmada=${RABBIT_ROUTING_CITA:cita.confirmada}
